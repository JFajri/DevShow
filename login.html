<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — DevShow</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="auth-page">


    <!-- =========================
         AUTH NAVBAR
         ========================= -->

    <header class="auth-navbar">

        <a
            href="index.html"
            class="brand"
        >

            <span class="brand-symbol">
                ◈
            </span>

            <span class="brand-name">
                DevShow
            </span>

        </a>

    </header>


    <!-- =========================
         LOGIN
         ========================= -->

    <main class="auth-main">

        <section class="auth-card">


            <!-- Header -->

            <div class="auth-header">

                <span class="section-label">
                    Welcome back
                </span>

                <h1>
                    Sign in to DevShow
                </h1>

                <p>
                    Continue building and sharing
                    your work.
                </p>

            </div>


            <!-- Form -->

            <form class="auth-form">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                </div>


                <!-- Options -->

                <div class="form-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="auth-submit"
                >
                    Login
                </button>


            </form>


            <!-- Divider -->

            <div class="auth-divider">

                <span></span>

                <p>
                    or
                </p>

                <span></span>

            </div>


            <!-- GitHub -->

            <button
                type="button"
                class="github-login"
            >

                <span>
                    ◇
                </span>

                Continue with GitHub

            </button>


            <!-- Register -->

            <p class="auth-register">

                Don't have an account?

                <a href="#">
                    Create account
                </a>

            </p>


        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
