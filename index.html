<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Penting untuk responsive/mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevShow</title>

    <!-- CSS utama -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
         ========================= -->

    <header class="navbar">

        <div class="navbar-container">

            <!-- Logo -->
            <a href="#" class="brand">
                <span class="brand-symbol">◈</span>
                <span class="brand-name">DevShow</span>
            </a>


            <!-- Desktop Navigation -->
            <nav class="nav-links">

                <a href="#" class="nav-link active">
                    Explore
                </a>

                <a href="#" class="nav-link">
                    Developers
                </a>

                <a href="#" class="nav-link">
                    Categories
                </a>

            </nav>


            <!-- Right Side -->
            <div class="nav-actions">

                <button class="theme-toggle" type="button" aria-label="Toggle theme">
                    ☼
                </button>

                <a href="#" class="login-button">
                    Login
                </a>

                <button class="menu-toggle" type="button" aria-label="Open menu">
                    <span></span>
                    <span></span>
                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         DEMO CONTENT
         ========================= -->

    <main>

        <!-- =========================
            HERO SECTION
            ========================= -->

        <section class="hero">

            <div class="hero-content">

                <span class="hero-label">
                    Developer Showcase Platform
                </span>

                <h1>
                    BUILD.
                    <span>SHARE.</span>
                    DISCOVER.
                </h1>

                <p class="hero-description">
                    A place where developers showcase their
                    projects, ideas, and creativity.
                </p>

                <div class="hero-actions">

                    <a href="#" class="hero-button primary">
                        Explore Projects
                    </a>

                    <a href="#" class="hero-button secondary">
                        Create Profile
                    </a>

                </div>

            </div>

            <div class="hero-scroll">
                <span></span>
                <p>Explore the collection</p>
            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
